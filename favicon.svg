<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#111"/>
  <!-- Fret board -->
  <rect x="9" y="5" width="14" height="22" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Nut -->
  <rect x="9" y="8" width="14" height="2.5" rx="1" fill="#555"/>
  <!-- Frets -->
  <rect x="9" y="14" width="14" height="1.5" rx=".75" fill="#333"/>
  <rect x="9" y="20" width="14" height="1.5" rx=".75" fill="#333"/>
  <!-- Strings -->
  <line x1="13" y1="6" x2="13" y2="26" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="16" y1="6" x2="16" y2="26" stroke="#3a3a3a" stroke-width="1.2"/>
  <line x1="19" y1="6" x2="19" y2="26" stroke="#3a3a3a" stroke-width="1.4"/>
  <!-- Fret dot (root) -->
  <circle cx="16" cy="17.5" r="2.8" fill="#4a9eff"/>
  <!-- Fret dot (fifth) -->
  <circle cx="19" cy="11.25" r="2" fill="#4a9eff88"/>
</svg>
